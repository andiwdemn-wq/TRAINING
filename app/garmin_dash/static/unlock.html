<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Training</title>
<style>
  :root { --bg: #ffffff; --panel: #f3f6f2; --ink: #0e1410; --muted: #5d6b61; --accent: #16a34a; --bad: #e5484d; --line: #e6ebe5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --panel: #0e100e; --ink: #f2f5f2; --muted: #8b968d; --accent: #4ade80; --bad: #f87171; --line: #232823; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  body { display: grid; place-items: center; padding: 24px 16px; }
  .box { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 28px 22px; }
  .logo { width: 52px; height: 52px; border-radius: 14px; display: block; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.01em; }
  p { margin: 0 0 20px; color: var(--muted); font-size: 14px; line-height: 1.45; }
  input[type=password] { width: 100%; font: inherit; font-size: 17px; padding: 13px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); outline: none; }
  input[type=password]:focus { border-color: var(--accent); }
  label { display: flex; gap: 10px; align-items: center; margin: 14px 0 18px; font-size: 14px; color: var(--muted); }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  button { width: 100%; font: inherit; font-size: 16px; font-weight: 700; padding: 13px; border: 0; border-radius: 12px;
    background: var(--accent); color: #000; cursor: pointer; }
  button:disabled { opacity: .6; }
  .err { color: var(--bad); font-size: 14px; min-height: 20px; margin-top: 12px; }
  .wait { color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<div class="wait" id="wait">Lädt …</div>
<form class="box" id="form" hidden autocomplete="on">
  <img class="logo" src="icon.png" alt="">
  <h1>Mein Training</h1>
  <p>Das Dashboard ist verschlüsselt. Mit deinem Passwort wird es nur hier auf dem Gerät entschlüsselt.</p>
  <input type="text" name="username" value="training" autocomplete="username" hidden>
  <input type="password" id="pw" autocomplete="current-password" placeholder="Passwort" required>
  <label><input type="checkbox" id="remember" checked> Auf diesem Gerät merken</label>
  <button id="go">Öffnen</button>
  <div class="err" id="err"></div>
</form>
<script>
(() => {
  const KEY = 'gd-unlock';
  const $ = id => document.getElementById(id);
  const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = u => btoa(String.fromCharCode(...u));
  const store = {
    get() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } },
    set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} },
    clear() { try { localStorage.removeItem(KEY); } catch (e) {} },
  };
  if (location.hash === '#vergessen') { store.clear(); history.replaceState(null, '', location.pathname); }

  async function derive(pw, salt, iterations) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations }, base, 256));
  }
  async function decrypt(d, raw) {
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(d.iv) }, key, fromB64(d.ct));
    const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).text();
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  function ask(msg) { $('wait').hidden = true; $('form').hidden = false; $('err').textContent = msg || ''; $('go').disabled = false; }

  let data;
  (async () => {
    try {
      const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      data = await r.json();
    } catch (e) { $('wait').textContent = 'Daten nicht erreichbar. Internetverbindung prüfen und neu laden.'; return; }
    const saved = store.get();
    if (saved && saved.salt === data.salt) {
      try { return show(await decrypt(data, fromB64(saved.key))); } catch (e) { store.clear(); }
    }
    ask(saved ? 'Passwort wurde geändert, bitte neu eingeben.' : '');
    $('pw').focus();
  })();

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    $('go').disabled = true; $('err').textContent = 'Entschlüssele …';
    try {
      const raw = await derive($('pw').value, fromB64(data.salt), data.iter);
      const html = await decrypt(data, raw);
      if ($('remember').checked) store.set({ salt: data.salt, key: toB64(raw) });
      show(html);
    } catch (err) { ask('Falsches Passwort.'); $('pw').select(); }
  });
})();
</script>
</body>
</html>
