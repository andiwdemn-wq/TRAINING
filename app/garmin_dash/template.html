// ================================================================ Alltag
function renderDaily(r) {
  const g = gridOf('sec-daily');
  const days = r.days;
  if (state.period.id === 'day') {
    const x = DAILY[r.end] || {};
    const im = x.im_mod != null ? x.im_mod + 2 * (x.im_vig || 0) : null;
    statCard(g, 'Tageswerte', [['Schritte', nf(x.steps, 0), x.step_goal ? '/ ' + nf(x.step_goal, 0) : ''], ['Distanz', nf(x.dist_km, 1), 'km'],
      ['Kalorien', nf(x.kcal, 0), 'kcal'], ['Aktive Kalorien', nf(x.kcal_active, 0), 'kcal'], ['Intensitätsminuten', im, 'min'],
      ['Ø Stress', x.stress], ['Max. Stress', x.stress_max], ['Stockwerke', x.floors]], '', FULL);
    return;
  }
  const bks = buckets(days, state.period.bucket);
  const isDayBucket = state.period.bucket === 'day';
  const avgB = (b, k) => { const a = avg(series(b.days, k)); return a == null ? null : Math.round(a); };

  makeChart(g, { title: isDayBucket ? 'Schritte' : `Schritte, Ø pro Tag je ${bucketName()}`, legend: [{ label: 'Schritte', color: C.c1 }, { label: 'Ziel (schraffiert)', color: alpha(C.ink, .25) }] }, {

      bar('Ziel', ghost, hatch(alpha(C.ink, .14)), { grouped: false, order: 2 })] },
    options: { plugins: { tooltip: { callbacks: { label: c => c.datasetIndex === 0 ? ` Schritte: ${nf(c.raw, 0) ?? '–'}` : ` Ziel: ${nf(goalData[c.dataIndex], 0) ?? '–'}` } } } } });
  trendChart(g, r, 'stress', 'Ø Stress', 'Stresslevel 0 bis 100', C.c3, { fmt: v => nf(v, 0), better: 'down' });
  const imB = buckets(days, isDayBucket ? 'day' : 'week');
  makeChart(g, { title: isDayBucket ? 'Intensitätsminuten pro Tag' : 'Intensitätsminuten pro Woche', sub: 'mäßig + 2 × intensiv', legend: [{ label: 'Mäßig', color: alpha(C.c1, .45) }, { label: 'Intensiv ×2', color: C.c1 }] }, {

      bar('Mäßig', imB.map(b => { const v = series(b.days, 'im_mod').filter(x => x != null); return v.length ? sum(v) : null; }), alpha(C.c1, .45), { stack: 'i', borderRadius: 0 }),
      bar('Intensiv ×2', imB.map(b => { const v = series(b.days, 'im_vig').filter(x => x != null); return v.length ? 2 * sum(v) : null; }), C.c1, { stack: 'i', borderRadius: { topLeft: 6, topRight: 6 } })] },

// ================================================================ Wochenziele (Seitenleiste)

  document.getElementById('footer').innerHTML =
    `Letzte Aktualisierung: <b>${gen.toLocaleString('de-DE', { dateStyle: 'full', timeStyle: 'short' })}</b> · Daten vom ${fmtDate(FIRST_DAY)} bis ${fmtDate(LAST_DAY)}` +
    (rows ? `<details><summary>Datenquellen (Tage mit Daten / ohne Daten / Fehler)</summary><table><thead><tr><th>Quelle</th><th class="num">Daten</th><th class="num">leer</th><th class="num">Fehler</th></tr></thead><tbody>${rows}</tbody></table></details>` : '');
}

// ================================================================ Steuerung
function render() {
  charts.forEach(c => c.destroy()); charts = []; hatchCache = {};
  readColors(); chartDefaults();
  const r = ranges();
  document.querySelectorAll('#periods button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === state.period.id));
  document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeSet === document.documentElement.dataset.theme));
  const inp = document.getElementById('anchor'); inp.value = state.anchor; inp.max = LAST_DAY; inp.min = FIRST_DAY;
  document.getElementById('next').disabled = state.anchor >= LAST_DAY;
  document.getElementById('prev').disabled = r.start <= FIRST_DAY;
  document.getElementById('rangeLabel').textContent = state.period.id === 'day'
    ? toDate(r.end).toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' })
    : `${fmtLong(r.start)} bis ${fmtLong(r.end)} · verglichen mit den ${state.period.days} Tagen davor`;
  renderTiles(r); renderHero(r); renderPerf(r); renderGoals(); renderPlan(r);
  renderRun(r); renderStrength(r); renderOther(r); renderRecovery(r); renderFitness(r); renderDaily(r); renderBody(r); renderActs(r);
  // ungerade Kartenzahl: letzte Karte über die volle Breite, damit keine Lücke bleibt
  document.querySelectorAll('section .grid').forEach(g => {
    const half = [...g.children].filter(c => !c.style.gridColumn);
    if (half.length % 2) half[half.length - 1].style.gridColumn = FULL;
  });
}
document.getElementById('periods').innerHTML = PERIODS.map(p => `<button data-id="${p.id}">${p.label}</button>`).join('');
document.getElementById('periods').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.period = PERIODS.find(p => p.id === b.dataset.id); store.set('gd-period', state.period.id); render();
});
document.querySelectorAll('[data-theme-set]').forEach(b => b.addEventListener('click', () => {
  document.documentElement.dataset.theme = b.dataset.themeSet; store.set('gd-theme', b.dataset.themeSet); render();
}));
const shift = dir => { let a = addDays(state.anchor, dir * state.period.days); if (a > LAST_DAY) a = LAST_DAY; if (a < FIRST_DAY) a = FIRST_DAY; state.anchor = a; render(); };
document.getElementById('prev').onclick = () => shift(-1);
document.getElementById('next').onclick = () => shift(1);
document.getElementById('anchor').onchange = e => { if (e.target.value) { state.anchor = e.target.value > LAST_DAY ? LAST_DAY : e.target.value; render(); } };
buildNav();
renderFrame();
setupPull();
render();
// Wechsel PC-Fenster <-> Handybreite: neu zeichnen
matchMedia('(max-width: 640px)').addEventListener('change', () => render());
if (HASH.get('focus')) {
  const el = document.getElementById(HASH.get('focus'));
  if (el && STILL) document.querySelector('main').style.marginTop = `-${el.getBoundingClientRect().top + window.scrollY - 24}px`;
  else el?.scrollIntoView({ block: 'start' });
}
if (document.fonts && !STILL) document.fonts.ready.then(() => charts.forEach(c => c.update('none')));
</script>
</body>
</html>
